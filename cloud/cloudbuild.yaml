steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --tag, '${_REGION}-docker.pkg.dev/$PROJECT_ID/home-tv/lunatv:${_TAG}', .]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/home-tv/lunatv:${_TAG}'
substitutions:
  _REGION: asia-east1
  _TAG: home-tv
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
timeout: 1200s
